# The app name as it should appear in F-Droid
Name: Caravella

# Package name (must match applicationId in build.gradle)
PackageName: io.caravella.egm

# Summary (80 chars max)
Summary: Split group expenses and see who owes whom

# Full description
Description: |-
  Caravella is the simple way to split expenses with friends, family and roommates. Create a group for a trip, a shared flat or an event, add what everyone spends, and Caravella tells you who owes whom — no spreadsheets, no arguments.

  <b>A clear, calm design</b>
  • Home shows your group with its total, today's spending and your latest expenses
  • Create a group in a few short steps and add friends right away
  • Each group has its page with expenses, balances and statistics — swipe between them
  • Soft group colors or your own photo, light and dark theme

  <b>Add expenses in seconds</b>
  • Pick who paid and the category with a single tap
  • Say it out loud: amount and description are filled in for you
  • Attach a photo of the receipt, notes and the place where you spent

  <b>Know who owes whom</b>
  • Automatic balances and settle-up suggestions
  • Day-by-day, weekly and monthly charts
  • Breakdown by participant and category
  • Fast search with filters

  <b>Sync with friends (optional)</b>
  • Share a group with devices on the same Wi-Fi, paired with a QR code
  • End-to-end encrypted, never through a server

  <b>Your data, your rules</b>
  • Works offline, no account required
  • Your data stays on your device
  • Backup, restore and CSV export at any time
  • Available in English, Italian, Spanish, Portuguese and Chinese
  • Open source (MIT license)
# Anti-features (none for this app)
AntiFeatures: []

# Build configuration
#
# F-Droid builds the FOSS variant: `./build_variant.sh foss` swaps
# packages/caravella_gms (Play Services, ML Kit, Play Core) for
# packages/caravella_gms_foss, so no proprietary library is compiled in, and
# the packages that only the Play build uses are deleted before the scan.
# The test-only dev dependency sqflite_common_ffi is dropped too: its sqlite3
# build hook would bundle a prebuilt libsqlite3.so. Because the FOSS variant
# drops packages, pubspec.lock is rewritten (removals only), so `pub get`
# runs without --enforce-lockfile. Flutter is pinned to the version CI uses.
# Following fdroiddata's Flutter template, each release has one build per ABI
# (--split-per-abi); Flutter numbers them 1000/2000/4000 + versionCode for
# armeabi-v7a/arm64-v8a/x86_64, hence VercodeOperation. The compileSdk
# platform and the build-tools AGP 9.1 defaults to (36.0.0) are installed up
# front: if AGP downloads build-tools itself mid-build, it reloads the SDK and no longer
# finds 'android-37'. The recipe also turns off the release lint check (with
# JDK 21 it reports a false 'MainActivity must extend Activity') and the
# release signing config, since F-Droid builds unsigned and signs the APK
# itself (reproducible builds are off for good: the FOSS APK is a different
# variant from the Play/GitHub one). Only tags from v2.0.1 on contain the FOSS
# variant. The copy submitted to fdroiddata (metadata/io.caravella.egm.yml,
# merge request !52814) has the same Builds entries.
Builds:
  - versionName: 2.2.1
    versionCode: 1127
    commit: cedc4d8f1105a28ed9cb84d4ec52d6314b3c81c7
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - web
      - windows
      - packages/caravella_gms
      - packages/google_drive_sync
      - packages/play_store_updates
    prebuild:
      - sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/Development*Android.yml
        | head -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e '/sqflite_common_ffi/d' pubspec.yaml
      - ./build_variant.sh foss --no-pub-get
      - sed -i -e 's/^android {$/android { lint { checkReleaseBuilds = false }/' -e
        '/signingConfig = signingConfigs.getByName("release")/d' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor prod --dart-define=FLAVOR=prod
        --split-per-abi --target-platform=android-arm
    ndk: r28c

