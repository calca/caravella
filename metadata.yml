# The app name as it should appear in F-Droid
Name: Caravella

# Package name (must match applicationId in build.gradle)
PackageName: io.caravella.egm

# Summary (80 chars max)
Summary: Modern group expense management app

# Full description
Description: |-
  Caravella is a modern, multi-platform Flutter application designed to simplify 
  expense management for groups, trips, and events. Built with Material 3, it offers 
  an intuitive and clean user experience for tracking shared costs, managing 
  participants, and settling debts.

  Whether you're on a group trip, sharing an apartment with roommates, or organizing 
  an event, Caravella helps you keep everything organized and transparent. All data 
  is stored locally on your device, ensuring privacy and offline availability.

  <b>Key Features:</b>
  * Group Management - Create and manage distinct groups for trips, events, or shared living
  * Expense Tracking - Add expenses with categories and participant assignments
  * Material 3 UI - Beautiful modern interface with light/dark mode support
  * Dashboard - Quick overview of current group, total expenses, and quick actions
  * Detailed Summaries - Clear breakdown of who owes what to whom
  * Data Persistence - Local storage ensures offline availability and privacy
  * Backup & Restore - Export and import all app data for backups or device migration
  * CSV Export - Export expense lists for external analysis
  * Multi-Language Support - Available in English, Italian, and Spanish
  * Cross-Platform - Designed for Android, iOS, Web, and Desktop

  <b>Privacy & Security:</b>
  * All data stored locally on your device
  * No user accounts or online services required
  * Optional permissions for enhanced features (camera, location)
  * Full data export and deletion control
  * GDPR and privacy compliant

  The app requires no internet connection for core functionality and gives you 
  complete control over your financial data.

# Anti-features (none for this app)
AntiFeatures: []

# Build configuration
#
# F-Droid builds the FOSS variant: `./build_variant.sh foss` swaps
# packages/caravella_gms (Play Services, ML Kit, Play Core) for
# packages/caravella_gms_foss, so no proprietary library is compiled in, and
# the packages that only the Play build uses are deleted before the scan.
# The test-only dev dependency sqflite_common_ffi is dropped too: its sqlite3
# build hook would bundle a prebuilt libsqlite3.so. Flutter is pinned to the
# version CI uses. Only tags from v2.0.1 on contain the FOSS variant — older
# tags can't be built without non-free dependencies. The copy submitted to
# fdroiddata (metadata/io.caravella.egm.yml) has the same Builds entry.
Builds:
  - versionName: 2.0.1
    versionCode: 123
    commit: 412a722047db68446d791713963bb18ec9e9fd1f
    output: build/app/outputs/flutter-apk/app-prod-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - web
      - windows
      - packages/caravella_gms
      - packages/google_drive_sync
      - packages/play_store_updates
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/Development*Android.yml
        | head -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e '/sqflite_common_ffi/d' pubspec.yaml
      - ./build_variant.sh foss --no-pub-get
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor prod --dart-define=FLAVOR=prod
    ndk: r28c

# Auto-update configuration
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.0.1
CurrentVersionCode: 123
