name: Android CI - Store

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build (prod AAB upload to Play)'
        required: true
        default: 'main'
      track:
        description: 'Play track (internal|alpha|beta|production)'
        required: true
        default: 'internal'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      ENABLE_ANDROID_WIDGET: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0
      - name: Show build branch
        run: |
          echo "Building branch: ${{ github.event.inputs.target_branch }}"
          echo "Requested track: ${{ github.event.inputs.track }}"
      - name: Validate track
        run: |
          ALLOWED="internal alpha beta production"
          if ! echo "$ALLOWED" | grep -qw "${{ github.event.inputs.track }}"; then
            echo "Invalid track '${{ github.event.inputs.track }}'. Allowed: $ALLOWED" >&2
            exit 1
          fi
          echo "TRACK=${{ github.event.inputs.track }}" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
      - name: Decode keystore from secret
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          test -s android/upload-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Configure signing properties
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Package boundary guard
        run: ./validate_package_boundaries.sh
      - name: Run tests
        run: flutter test
      - name: Test local packages
        run: |
          set -e
          for pkg in packages/*/; do
            if [ -f "${pkg}pubspec.yaml" ]; then
              echo "== flutter test: $pkg =="
              (cd "$pkg" && flutter pub get && flutter test)
            fi
          done
      - name: Build prod App Bundle (signed)
        run: flutter build appbundle --flavor prod --release --dart-define=FLAVOR=prod --dart-define=ENABLE_PLAY_UPDATES=true --dart-define=ENABLE_BLUETOOTH_SYNC=true --dart-define=ENABLE_GOOGLE_DRIVE_SYNC=true --dart-define=ENABLE_ANDROID_WIDGET=false --dart-define=UNSPLASH_ACCESS_KEY=$UNSPLASH_ACCESS_KEY
      # Same commit and flags as the AAB, for the GitHub release (sideloading).
      - name: Build prod APK (signed)
        run: flutter build apk --flavor prod --release --dart-define=FLAVOR=prod --dart-define=ENABLE_PLAY_UPDATES=true --dart-define=ENABLE_BLUETOOTH_SYNC=true --dart-define=ENABLE_GOOGLE_DRIVE_SYNC=true --dart-define=ENABLE_ANDROID_WIDGET=false --dart-define=UNSPLASH_ACCESS_KEY=$UNSPLASH_ACCESS_KEY
      - name: Get app version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/\+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Get current date
        id: get_date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Rename AAB
        run: |
          mv build/app/outputs/bundle/prodRelease/app-prod-release.aab io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab
      - name: Verify AAB exists
        run: |
          ls -l io_caravella_egm-*.aab || true
          if [ ! -f "io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab" ]; then
            echo "Expected AAB not found: io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab" >&2
            echo "Contents of bundle output directory:" >&2
            ls -R build/app/outputs/bundle || true
            exit 1
          fi
      - name: Generate SHA256 checksum
        run: |
          sha256sum io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab | tee io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab.sha256
      - name: Verify checksum file
        run: |
          sha256sum -c io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab.sha256
      - name: Debug list bundle files
        run: |
          echo "Listing current directory:" && ls -al
          echo "Listing AAB & checksum files:" && ls -1 io_caravella_egm-*.* || true
          echo "Checksum file contents:" && cat io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab.sha256 || true
      - name: Upload AAB artifact (pre-Play)
        uses: actions/upload-artifact@v4
        with:
          name: io_caravella_egm-prod-aab
          path: |
            io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab
            io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab.sha256
      # Play already gets the R8 mapping and native symbols from inside the
      # AAB (BUNDLE-METADATA) and shows them under App bundle explorer, but
      # doesn't let you download them back. Keep a copy per release so
      # obfuscated names in Play Console recommendations/crashes can be
      # retraced locally (`retrace mapping.txt stacktrace.txt`).
      - name: Upload R8 mapping and native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: io_caravella_egm-${{ env.VERSION }}-mapping
          path: |
            build/app/outputs/mapping/prodRelease/mapping.txt
            build/app/outputs/native-debug-symbols/prodRelease/native-debug-symbols.zip
          if-no-files-found: warn
          retention-days: 90
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.caravella.egm
          releaseFiles: |
            io_caravella_egm-${{ env.VERSION }}-${{ env.DATE }}.aab
          track: ${{ env.TRACK }}
          status: completed
          inAppUpdatePriority: 3
        env:
          JAVA_DISTRIBUTION: 'temurin'
      # Draft GitHub release v<version> for this exact commit, with the prod APK.
      # It stays invisible until "Android CI - Store Promote" moves the version
      # to production, which publishes it. Re-running this workflow for the
      # same version replaces the draft.
      - name: Prepare draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "::warning::$TAG is already published on GitHub; leaving it as it is"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id"; done
          PREVIOUS=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -1)
          if ! python3 .github/scripts/release_notes.py "$VERSION" --kind store \
               --tag "$TAG" --previous-tag "$PREVIOUS" > notes.md; then
            echo "::warning::No CHANGELOG.md section for $VERSION yet: draft uses [Unreleased]; Store Promote refreshes the notes when publishing"
            python3 .github/scripts/release_notes.py Unreleased --kind store \
              --tag "$TAG" --previous-tag "$PREVIOUS" > notes.md
          fi
          APK="io_caravella_egm-$VERSION.apk"
          mv build/app/outputs/flutter-apk/app-prod-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --draft \
            --target "$(git rev-parse HEAD)" \
            --title "Caravella $VERSION" \
            --notes-file notes.md
          echo "### Draft GitHub release $TAG ready; Store Promote to production publishes it" >> $GITHUB_STEP_SUMMARY
