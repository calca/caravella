name: Android CI - Development

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
      - name: Decode keystore from secret
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          test -s android/upload-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Configure signing properties
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Package boundary guard
        run: ./validate_package_boundaries.sh
      - name: Accessibility regression guard
        run: ./validate_accessibility.sh --skip-tests
      - name: Design token regression guard
        run: ./validate_design_tokens.sh
      - name: Run tests
        run: flutter test --coverage
      - name: Test local packages
        run: |
          set -e
          for pkg in packages/*/; do
            if [ -f "${pkg}pubspec.yaml" ]; then
              echo "== flutter test: $pkg =="
              (cd "$pkg" && flutter pub get && flutter test)
            fi
          done
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
      # The F-Droid build swaps packages/caravella_gms for
      # packages/caravella_gms_foss (./build_variant.sh foss). Make sure that
      # variant still compiles and that no proprietary Google artifact
      # (Play Services, ML Kit, Play Core, Firebase) reaches its classpath,
      # then switch back for the Play build below.
      - name: F-Droid (FOSS) variant guard
        run: |
          set -e
          ./build_variant.sh fdroid-lock --check
          ./build_variant.sh foss
          flutter analyze
          ./build_variant.sh check
          ./build_variant.sh gms
      - name: Build staging APK (signed)
        run: flutter build apk --flavor staging --release --dart-define=FLAVOR=staging --dart-define=ENABLE_TALKER_SCREEN=true --dart-define=ENABLE_PLAY_UPDATES=true --dart-define=ENABLE_BLUETOOTH_SYNC=true --dart-define=ENABLE_GOOGLE_DRIVE_SYNC=true --dart-define=ENABLE_ANDROID_WIDGET=true --dart-define=UNSPLASH_ACCESS_KEY=$UNSPLASH_ACCESS_KEY
      - name: Get app version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/\+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Get current date
        id: get_date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-staging-release.apk io_caravella_egm-staging-$VERSION-$DATE.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: io_caravella_egm-staging-apk
          path: io_caravella_egm-staging-*.apk
